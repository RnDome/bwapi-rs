name: CI

on:
  push:
    branches: [master, new_design]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The toolchain comes from rust-toolchain.toml: rustup installs it on the first cargo call.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
