[workspace]
resolver = "3"
members = ["crates/bwapi", "crates/codegen", "crates/xtask"]
# Plain `cargo build/clippy/test` skip the generator; `cargo xtask` and `--workspace` reach it.
default-members = ["crates/bwapi"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dmitry Kashitsyn <korvin@deeptown.org>", "Roman Proskuryakov <r.proskuryakoff@gmail.com>"]
repository = "https://github.com/RnDome/bwapi-rs"
license = "Unlicense OR MIT"
